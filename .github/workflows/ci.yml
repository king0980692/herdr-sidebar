name: CI

on:
  push:
    branches: [main, leon]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: build + test + clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: plugins/herdr-sidebar
    steps:
      - uses: actions/checkout@v7
      - name: Reject tracked maintainer-only agent commands
        working-directory: .
        shell: bash
        run: |
          tracked=$(git ls-files |
            grep -Ei '^\.claude/commands($|/)|^\.codex/prompts($|/)' || true)
          if [ -n "$tracked" ]; then
            echo "Maintainer-only agent commands must remain local and ignored:" >&2
            echo "$tracked" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/herdr-sidebar
      - name: Test prebuilt installer (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\test-fetch-or-build.ps1
      - name: Test prebuilt installer (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/test-fetch-or-build.sh
      - run: cargo fmt --check
      - run: cargo build --release --locked
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
